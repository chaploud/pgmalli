name: ci
on:
  push:
    # the review lane too, which main catches up with: a pull request of it closes as merged then
    branches: [main, develop/review-lane]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # what does not need a database: lint, the docs and the jar
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the jar version comes from the latest release tag
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: checks-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: checks-${{ runner.os }}-
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          bb: 1.13.219
          clj-kondo: 2026.10.20
      - run: bb lint
      - run: bb test:docs
      - run: clojure -T:build jar
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18", "19"]
        # pgmalli.oracle-test takes as long as the rest: a job of its own (bb.edn's suite)
        suite: [main, oracle]
        # the oracle's mutants and generated values by seed; main's fuzzing keeps 42
        seed: ["42", "1", "7", "24"]
        exclude:
          - {suite: main, seed: "1"}
          - {suite: main, seed: "7"}
          - {suite: main, seed: "24"}
        # by digest, which Renovate updates: a new image runs in a pull request of its own
        include:
          - pg: "16"
            image: &floor-image postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
          - pg: "17"
            image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
          - pg: "18"
            image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
          - pg: "19"
            image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    env:
      PGMALLI_PG_IMAGE: ${{ matrix.image }}
      SUITE: ${{ matrix.suite }}
      PGMALLI_FUZZ_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          bb: 1.13.219
      - name: pull postgres image
        run: docker pull "$PGMALLI_PG_IMAGE"
      - run: bb test
        if: matrix.suite == 'main'
      - run: bb test:jvm "$SUITE"
  workflows:
    name: audit the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.1 .github/workflows
  floor:
    # the oldest versions README supports (bb.edn's test:floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [main, oracle]
    env:
      PGMALLI_PG_IMAGE: *floor-image
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: floor-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: floor-${{ runner.os }}-
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          bb: 1.13.219
      - name: pull postgres image
        run: docker pull "$PGMALLI_PG_IMAGE"
      - run: bb test:floor "$SUITE"
