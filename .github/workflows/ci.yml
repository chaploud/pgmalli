name: ci
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    env:
      PGMALLI_PG_IMAGE: postgres:${{ matrix.pg }}-alpine
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the jar version comes from the latest release tag
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest
          clj-kondo: latest
      - name: install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: pull postgres image
        run: docker pull "$PGMALLI_PG_IMAGE"
      - run: bb lint
      - run: bb test
      - run: bb test:jvm
      - run: bb test:docs
      - run: clojure -T:build jar
  floor:
    # the oldest versions README supports; here, not in deps.edn, where Renovate would raise them
    runs-on: ubuntu-latest
    env:
      PGMALLI_PG_IMAGE: postgres:16-alpine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: pull postgres image
        run: docker pull "$PGMALLI_PG_IMAGE"
      # fuzz-test builds its CHECKs with HoneySQL, which 2.4.1066 writes IS DISTINCT FROM in wrong
      - run: >-
          clojure -Sdeps '{:aliases {:floor {:override-deps {com.github.seancorfield/honeysql {:mvn/version "2.4.1066"}
          org.clojure/clojure {:mvn/version "1.11.4"} com.github.seancorfield/next.jdbc {:mvn/version "1.3.1048"}
          org.postgresql/postgresql {:mvn/version "42.7.7"}}}}}' -M:test:floor -r 'pgmalli\.(?!fuzz-test).*'
