name: ci
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # what does not need a database: lint, the docs and the jar
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the jar version comes from the latest release tag
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: checks-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: checks-${{ runner.os }}-
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          bb: 1.13.219
          clj-kondo: 2026.10.20
      - run: bb lint
      - run: bb test:docs
      - run: clojure -T:build jar
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
        # pgmalli-next.oracle-test takes as long as the rest: a job of its own (bb.edn's suite)
        suite: [main, oracle]
        # by digest, which Renovate updates: a new image runs in a pull request of its own
        include:
          - pg: "16"
            image: &floor-image postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
          - pg: "17"
            image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          - pg: "18"
            image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    env:
      PGMALLI_PG_IMAGE: ${{ matrix.image }}
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          bb: 1.13.219
      - name: pull postgres image
        run: docker pull "$PGMALLI_PG_IMAGE"
      - run: bb test
        if: matrix.suite == 'main'
      - run: bb test:jvm "$SUITE"
  workflows:
    name: audit the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.1 .github/workflows
  floor:
    # the oldest versions README supports (bb.edn's test:floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [main, oracle]
    env:
      PGMALLI_PG_IMAGE: *floor-image
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: floor-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: floor-${{ runner.os }}-
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          bb: 1.13.219
      - name: pull postgres image
        run: docker pull "$PGMALLI_PG_IMAGE"
      - run: bb test:floor "$SUITE"
