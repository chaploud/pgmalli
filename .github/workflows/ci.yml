name: ci
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
        # lint, the docs and the jar do not depend on the server: run them once, on the newest
        include:
          - pg: "18"
            once: true
    env:
      PGMALLI_PG_IMAGE: postgres:${{ matrix.pg }}-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the jar version comes from the latest release tag
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: latest
          bb: latest
          clj-kondo: latest
      # ir reads the test database with the host's psql
      - name: install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: pull postgres image
        run: docker pull "$PGMALLI_PG_IMAGE"
      - run: bb lint
        if: matrix.once
      - run: bb test
      - run: bb test:jvm
      - run: bb test:docs
        if: matrix.once
      - run: clojure -T:build jar
        if: matrix.once
  workflows:
    name: audit the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.1 .github/workflows
  floor:
    # the oldest versions README supports; here, not in deps.edn, where Renovate would raise them
    runs-on: ubuntu-latest
    env:
      PGMALLI_PG_IMAGE: postgres:16-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: latest
      - name: pull postgres image
        run: docker pull "$PGMALLI_PG_IMAGE"
      # fuzz-test builds its CHECKs with HoneySQL, which 2.4.1066 writes IS DISTINCT FROM in wrong
      - run: >-
          clojure -Sdeps '{:aliases {:floor {:override-deps {com.github.seancorfield/honeysql {:mvn/version "2.4.1066"}
          org.clojure/clojure {:mvn/version "1.11.4"} metosin/malli {:mvn/version "0.20.0"} com.github.seancorfield/next.jdbc {:mvn/version "1.3.1048"}
          org.postgresql/postgresql {:mvn/version "42.7.7"}}}}}' -M:test:floor -r 'pgmalli\.(?!fuzz-test).*'
