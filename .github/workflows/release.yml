name: release
# Pushing a vX.Y.Z tag on main builds the jar, publishes it to Clojars and creates a GitHub release.
# The tag is the version: v1.2.3 publishes 1.2.3.
# Secret: CLOJARS_PASSWORD, a Clojars deploy token of chaploud scoped to io.github.chaploud/pgmalli,
# kept in the environment clojars (deployments from v* tags only).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # tests and the jar run without the token, so that nothing they download can reach it
  build:
    name: test and build the jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          bb: 1.13.219
      # ir reads the test database with the host's psql
      - name: install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # what is published is what the suite passed on
      - run: bb test:jvm
      - run: echo "PGMALLI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: clojure -T:build jar
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jar
          path: |
            target/pgmalli.jar
            target/classes/META-INF/maven/io.github.chaploud/pgmalli/pom.xml
  deploy:
    name: publish to Clojars
    needs: build
    runs-on: ubuntu-latest
    environment: clojars
    steps:
      # for deps.edn's :deploy alias only
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: jar
          path: target
      - run: clojure -X:deploy
        env:
          CLOJARS_USERNAME: chaploud
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
  # a job of its own, so that it can be re-run when it fails: Clojars rejects publishing a version twice
  github-release:
    name: GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: jar
      - run: gh release create "$GITHUB_REF_NAME" pgmalli.jar --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
