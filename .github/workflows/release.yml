name: release
# Pushing a vX.Y.Z tag on main builds the jar, publishes it to Clojars and creates a GitHub release.
# The tag is the version: v1.2.3 publishes 1.2.3.
# Secret: CLOJARS_PASSWORD, a Clojars deploy token of chaploud scoped to io.github.chaploud/pgmalli,
# kept in the environment clojars (deployments from v* tags only).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # the suite runs without the token, and in a job of its own: no test dependency it loads
  # touches the workspace the jar is built in
  test:
    name: test the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      # the tools fetched afresh: a run on main may write the Actions cache a tag's run restores
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          bb: 1.13.219
          invalidate-cache: "true"
      # the image CI pins by digest
      - run: echo "PGMALLI_PG_IMAGE=$(bb -cp dev -m ci-images 17)" >> "$GITHUB_ENV"
      - run: bb test:jvm
  jar:
    name: build the jar
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # what is attested and published is checked against these, not the artifact's own checksum file

    outputs:
      jar: ${{ steps.sums.outputs.jar }}
      pom: ${{ steps.sums.outputs.pom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          invalidate-cache: "true"
      - run: echo "PGMALLI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # tools.build alone on the classpath
      - run: clojure -T:build jar
      - run: cd target && sha256sum pgmalli.jar > pgmalli.jar.sha256
      - id: sums
        run: |
          echo "jar=$(sha256sum target/pgmalli.jar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "pom=$(sha256sum target/classes/META-INF/maven/io.github.chaploud/pgmalli/pom.xml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jar
          path: |
            target/pgmalli.jar
            target/pgmalli.jar.sha256
            target/classes/META-INF/maven/io.github.chaploud/pgmalli/pom.xml
  # the signing token in a job that runs no build: the provenance is of the jar job's SHA-256s
  attest:
    name: attest the jar and its pom
    needs: jar
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the build provenance's signature
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: pgmalli.jar
          subject-digest: sha256:${{ needs.jar.outputs.jar }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: pom.xml
          subject-digest: sha256:${{ needs.jar.outputs.pom }}
  deploy:
    name: publish to Clojars
    needs: [test, jar, attest]
    runs-on: ubuntu-latest
    environment: clojars
    steps:
      # for deps.edn's :deploy alias only
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          invalidate-cache: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jar
          path: target
      # the artifact is the one the jar job built and attested, not one another job of the run uploaded
      - run: |
          echo "$JAR  target/pgmalli.jar" | sha256sum -c
          echo "$POM  target/classes/META-INF/maven/io.github.chaploud/pgmalli/pom.xml" | sha256sum -c
        env:
          JAR: ${{ needs.jar.outputs.jar }}
          POM: ${{ needs.jar.outputs.pom }}
      - run: clojure -X:deploy
        env:
          CLOJARS_USERNAME: chaploud
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
  # a job of its own, so that it can be re-run when it fails: Clojars rejects publishing a version twice
  github-release:
    name: GitHub release
    needs: [jar, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jar
      # the jar the jar job built, as deploy checks it
      - run: echo "$JAR  pgmalli.jar" | sha256sum -c
        env:
          JAR: ${{ needs.jar.outputs.jar }}
      - run: gh release create "$GITHUB_REF_NAME" pgmalli.jar pgmalli.jar.sha256 --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
