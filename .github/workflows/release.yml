name: release
# Pushing a vX.Y.Z tag on main builds the jar, publishes it to Clojars and creates a GitHub release.
# The tag is the version: v1.2.3 publishes 1.2.3.
# Secrets: CLOJARS_USERNAME, CLOJARS_PASSWORD (a deploy token).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest
      # ir reads the test database with the host's psql
      - name: install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # what is published is what the suite passed on
      - run: bb test:jvm
      - run: echo "PGMALLI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: clojure -T:build jar
      - run: clojure -X:deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
      - uses: actions/upload-artifact@v6
        with:
          name: jar
          path: target/pgmalli.jar
  # a job of its own, so that it can be re-run when it fails: Clojars rejects publishing a version twice
  github-release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: jar
      - run: gh release create "$GITHUB_REF_NAME" pgmalli.jar --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
