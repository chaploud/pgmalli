name: release
# Pushing a vX.Y.Z tag on main builds the jar, publishes it to Clojars and creates a GitHub release.
# The tag is the version: v1.2.3 publishes 1.2.3.
# Secret: CLOJARS_PASSWORD, a Clojars deploy token of chaploud scoped to io.github.chaploud/pgmalli-next,
# kept in the environment clojars (deployments from v* tags only).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # the suite runs without the token, and in a job of its own: no test dependency it loads
  # touches the workspace the jar is built in
  test:
    name: test the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          bb: 1.13.219
      # the image CI pins by digest
      - run: echo "PGMALLI_PG_IMAGE=$(bb -cp dev -m ci-images 17)" >> "$GITHUB_ENV"
      - run: bb test:jvm
  jar:
    name: build the jar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the build provenance's signature
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
      - run: echo "PGMALLI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # tools.build alone on the classpath
      - run: clojure -T:build jar
      - run: cd target && sha256sum pgmalli-next.jar > pgmalli-next.jar.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/pgmalli-next.jar
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jar
          path: |
            target/pgmalli-next.jar
            target/pgmalli-next.jar.sha256
            target/classes/META-INF/maven/io.github.chaploud/pgmalli-next/pom.xml
  deploy:
    name: publish to Clojars
    needs: [test, jar]
    runs-on: ubuntu-latest
    environment: clojars
    steps:
      # for deps.edn's :deploy alias only
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: jar
          path: target
      - run: clojure -X:deploy
        env:
          CLOJARS_USERNAME: chaploud
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
  # a job of its own, so that it can be re-run when it fails: Clojars rejects publishing a version twice
  github-release:
    name: GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: jar
      - run: gh release create "$GITHUB_REF_NAME" pgmalli-next.jar pgmalli-next.jar.sha256 --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
