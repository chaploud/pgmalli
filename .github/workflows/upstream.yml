name: upstream
# bb upstream: the suite against the newest HoneySQL, next.jdbc, pgjdbc, malli and PostgreSQL.
# Kept out of ci.yml so a release upstream never turns a pull request red.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      pg-image:
        description: "the PostgreSQL image to run on (a beta tag, say)"
        default: postgres:alpine
permissions:
  contents: read
concurrency:
  group: upstream
  cancel-in-progress: true
jobs:
  # the newest upstreams run with no token that writes: what they load cannot reach one
  upstream:
    name: suite on the newest upstreams
    # forks inherit the schedule; the report belongs to this repository's issues
    if: github.repository == 'chaploud/pgmalli-next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.run.outcome }}
    env:
      PGMALLI_PG_IMAGE: ${{ inputs.pg-image || 'postgres:alpine' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.5.1664
          bb: 1.13.219
      # psql is on the runner image
      - name: pull postgres image
        run: docker pull "$PGMALLI_PG_IMAGE"
      - name: bb upstream
        id: run
        continue-on-error: true
        run: |
          set -o pipefail
          bb upstream | tee upstream-report.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upstream-report
          path: upstream-report.md
  # one open issue labelled upstream: a failure comments on it (or opens it), a pass closes it
  report:
    name: report on the upstream issue
    needs: upstream
    if: always() && needs.upstream.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write # opens, comments on and closes the upstream issue
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: upstream-report
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ needs.upstream.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create upstream --color D93F0B --description "bb upstream: the suite against the newest upstreams" 2>/dev/null || true
          issue=$(gh issue list --label upstream --state open --json number --jq '.[0].number // empty')
          if [ "$OUTCOME" = failure ]; then
            { echo "bb upstream fails: $RUN_URL"
              echo
              echo "Each line names the upstream change and what to update; run \`bb upstream\` to see it locally."
              echo
              tail -c 60000 upstream-report.md; } > body.md
            if [ -n "$issue" ]; then gh issue comment "$issue" --body-file body.md
            else gh issue create --title "Upstream: the suite fails on the newest versions" --label upstream --body-file body.md; fi
            exit 1
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "bb upstream passes again: $RUN_URL"
          fi
