name: upstream
# bb upstream: the suite against the newest HoneySQL, next.jdbc, pgjdbc, malli and PostgreSQL.
# Kept out of ci.yml so a release upstream never turns a pull request red.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest
      - name: install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: pull postgres image
        run: docker pull postgres:alpine
      - run: bb upstream
